name: Build patched APK from source archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the source release containing antigravity-android-2.4.1.zip"
        required: true
        default: "source-v2.4.1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'source-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow and patch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip patch

      - name: Download source archive attached to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/source
          gh release download "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "antigravity-android-2.4.1.zip" \
            --dir /tmp/source
          unzip -q /tmp/source/antigravity-android-2.4.1.zip -d /tmp/source
          test -f /tmp/source/antigravity-android-2.4.1/build.sh

      - name: Apply and verify Snapdragon 685 stability patch
        working-directory: /tmp/source/antigravity-android-2.4.1
        run: |
          git apply --check "${GITHUB_WORKSPACE}/patches/snapdragon685-fix.patch"
          git apply "${GITHUB_WORKSPACE}/patches/snapdragon685-fix.patch"

      - name: Build standard APK
        working-directory: /tmp/source/antigravity-android-2.4.1
        run: bash build.sh

      - name: Build region-bypass APK
        working-directory: /tmp/source/antigravity-android-2.4.1
        run: bash build.sh --region-bypass

      - name: Generate checksums
        working-directory: /tmp/source/antigravity-android-2.4.1
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-region-bypass.apk > SHA256SUMS.txt

      - name: Upload patched APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-apks-snapdragon685-patched
          path: |
            /tmp/source/antigravity-android-2.4.1/dist/antigravity.apk
            /tmp/source/antigravity-android-2.4.1/dist/antigravity-region-bypass.apk
            /tmp/source/antigravity-android-2.4.1/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
